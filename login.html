<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fireco OS | Office Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .slogan {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .page-title {
      margin-top: 22px;
      font-size: 18px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
      background: #f7e4e4;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="brand">
      <h1>FIRECO, INC.</h1>
      <div class="slogan">
        WE TAKE LIFE SAFETY SERIOUSLY
      </div>
      <div class="page-title">
        FIRECO OS • OFFICE LOGIN
      </div>
    </div>

    <form id="loginForm">

      <label>Email Address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button
        id="loginButton"
        type="submit"
      >
        SIGN IN
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script>
    const SUPABASE_URL =
      "https://ovpqmzxlikrhzxajtday.supabase.co";

    const SUPABASE_KEY =
  "sb_publishable_wodv28HysVdcm5QTmiDIHw_99b0FbMF";

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    async function checkExistingLogin(){

      const {
        data: { session }
      } = await db.auth.getSession();

      if(session){
        window.location.href = "office.html";
      }
    }

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          const email =
            document.getElementById("email").value.trim();

          const password =
            document.getElementById("password").value;

          const button =
            document.getElementById("loginButton");

          const message =
            document.getElementById("message");

          button.disabled = true;
          button.textContent = "SIGNING IN...";
          message.style.display = "none";

          const { error } =
            await db.auth.signInWithPassword({
              email: email,
              password: password
            });

          if(error){

            message.textContent =
              "Unable to sign in. Check your email and password.";

            message.style.display = "block";

            button.disabled = false;
            button.textContent = "SIGN IN";

            return;
          }

          window.location.href = "office.html";
        }
      );

    checkExistingLogin();
  </script>

</body>
</html>

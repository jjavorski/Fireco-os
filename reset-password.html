<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fireco OS — Reset Password</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      background:#f3f3f3;
      color:#171717;
      font-family:Arial,Helvetica,sans-serif;
    }

    .header{
      background:#111;
      color:#fff;
      text-align:center;
      padding:28px 18px;
    }

    .brand{
      font-family:Georgia,"Times New Roman",serif;
      font-size:28px;
      font-weight:700;
    }

    .tag{
      margin-top:6px;
      font-size:14px;
    }

    .card{
      max-width:440px;
      margin:60px auto;
      background:#fff;
      padding:30px;
      border-radius:8px;
      box-shadow:0 2px 12px rgba(0,0,0,.12);
    }

    h2{
      margin-top:0;
      text-align:center;
    }

    label{
      display:block;
      margin-top:18px;
      margin-bottom:6px;
      font-weight:700;
    }

    input{
      width:100%;
      padding:12px;
      font-size:16px;
      border:1px solid #bbb;
      border-radius:5px;
    }

    button{
      width:100%;
      margin-top:22px;
      padding:13px;
      border:0;
      border-radius:5px;
      background:#111;
      color:#fff;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }

    #message{
      margin-top:18px;
      text-align:center;
      line-height:1.4;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="brand">FIRECO, INC.</div>
    <div class="tag">WE TAKE LIFE SAFETY SERIOUSLY</div>
  </div>

  <div class="card">
    <h2>Reset Office Password</h2>

    <label for="password">New Password</label>
    <input
      id="password"
      type="password"
      autocomplete="new-password"
    >

    <label for="confirmPassword">Confirm New Password</label>
    <input
      id="confirmPassword"
      type="password"
      autocomplete="new-password"
    >

    <button id="resetButton">Update Password</button>

    <div id="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ovpqmzxlikrhzxajtday.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_wodv28HysVdcm5QTmiDIHw_99b0FbMF";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    document
      .getElementById("resetButton")
      .addEventListener("click", async () => {

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const message =
          document.getElementById("message");

        if(!password){
          message.textContent =
            "Please enter a new password.";
          return;
        }

        if(password !== confirmPassword){
          message.textContent =
            "The passwords do not match.";
          return;
        }

        message.textContent =
          "Updating password...";

        const { error } =
          await db.auth.updateUser({
            password: password
          });

        if(error){
          message.textContent =
            "Password could not be updated: " +
            error.message;
          return;
        }

        message.textContent =
          "Password updated successfully. Redirecting to login...";

        await db.auth.signOut();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      });
  </script>

</body>
</html>

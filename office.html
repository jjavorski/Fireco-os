<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fireco OS — Office Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f3f3;
  color:#171717;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:#111;
  color:#fff;
  padding:26px 18px 24px;
  text-align:center;
}

.brand{
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;
  font-weight:700;
}

.tag{
  font-family:Georgia,"Times New Roman",serif;
  font-size:11px;
  letter-spacing:1.5px;
  margin-top:5px;
}

.title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:17px;
  font-weight:700;
  margin-top:15px;
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 10px #0001;
}

.stat-label{
  font-size:12px;
  font-weight:700;
  color:#666;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.stat-number{
  font-size:30px;
  font-weight:800;
  margin-top:6px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 10px #0001;
}

.card h2{
  margin:0 0 15px;
  font-size:18px;
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.toolbar input{
  flex:1;
  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:700;
  cursor:pointer;
  background:#111;
  color:#fff;
}

.report{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-bottom:10px;
}

.report-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.report-date{
  font-weight:800;
  font-size:16px;
}

.status{
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
}

.ready{
  background:#e7f6e9;
}

.incomplete{
  background:#fff3cd;
}

.detail{
  margin-top:10px;
  font-size:14px;
  line-height:1.5;
}

.detail strong{
  display:inline-block;
  min-width:125px;
}

.empty{
  padding:25px;
  text-align:center;
  color:#777;
}

.error{
  background:#fbeaea;
  color:#8a1f1f;
  padding:14px;
  border-radius:10px;
  margin-bottom:15px;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
  }

  .report-top{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">FIRECO, INC.</div>
  <div class="tag">WE TAKE LIFE SAFETY SERIOUSLY</div>
  <div class="title">OFFICE DASHBOARD</div>
</header>

<div class="container">

  <div id="errorBox"></div>

<div class="stat" id="allReportsFilter" style="cursor:pointer;">
  <div class="stat-label">Total Reports</div>
  <div class="stat-number" id="totalReports">0</div>
</div>

<div class="stat" id="readyFilter" style="cursor:pointer;">
  <div class="stat-label">Ready to Invoice</div>
  <div class="stat-number" id="readyReports">0</div>
</div>

<div class="stat" id="incompleteFilter" style="cursor:pointer;">
  <div class="stat-label">Not Complete</div>
  <div class="stat-number" id="incompleteReports">0</div>
</div>

<div class="stat">
  <div class="stat-label">Regular Hours</div>
  <div class="stat-number" id="regularHours">0</div>
</div>
  <div class="stat">
    <div class="stat-label">Overtime Hours</div>
    <div class="stat-number" id="overtimeHours">0</div>
  </div>
</section>
  <section class="card">

    <h2>Field Reports</h2>

<div class="toolbar">

  <input
    id="search"
    type="text"
    placeholder="Search reports..."
  >

  <select id="employeeFilter">
    <option value="">All Employees</option>
  </select>

  <input
    id="dateFrom"
    type="date"
  >

  <input
    id="dateTo"
    type="date"
  >
<button type="button" id="todayButton">
  Today
</button>

<button type="button" id="thisWeekButton">
  This Week
</button>

<button type="button" id="lastWeekButton">
  Last Week
</button>

<button type="button" id="thisMonthButton">
  This Month
</button>
  <button id="refreshButton">
    Refresh
  </button>

</div>
<div id="reports">
  <div class="empty">
    Loading field reports...
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

const SUPABASE_URL =
  "https://ovpqmzxlikrhzxajtday.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wodv28HysVdcm5QTmiDIHw_99b0FbMF";

let db = null;
let allReports = [];

function escapeHtml(value){
  if(value === null || value === undefined) return "";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showError(message){
  document.getElementById("errorBox").innerHTML =
    '<div class="error">⚠️ '+escapeHtml(message)+'</div>';
}

function formatDate(value){
  if(!value) return "No date";

  const parts = String(value).split("-");

  if(parts.length === 3){
    return parts[1] + "/" + parts[2] + "/" + parts[0];
  }

  return value;
}

function renderReports(){

  const box = document.getElementById("reports");
  const search =
    document.getElementById("search").value
      .trim()
      .toLowerCase();
const selectedEmployee =
  document.getElementById("employeeFilter").value
    .trim()
    .toLowerCase();
  const dateFrom =
  document.getElementById("dateFrom").value;

const dateTo =
  document.getElementById("dateTo").value;
  const filtered = allReports.filter(report => {

  const crewText = (report.crew || [])
    .map(person => person.employee_name || "")
    .join(" ");

 const formattedReportDate = formatDate(String(report.report_date || "").substring(0, 10));

const text = [
  report.report_date,
  formattedReportDate,
  report.project_name,
  report.work_order_number,
  report.job_for_assigned_by,
  crewText,
  report.locations,
  report.work_accomplished,
  report.materials_used,
  report.completion_status,
  report.completion_notes,
  report.tomorrow_plan
]
  .join(" ")
  .toLowerCase();

const matchesSearch = text.includes(search);

const matchesEmployee =
  selectedEmployee === "" ||
  (report.crew || []).some(person =>
    String(person.employee_name || "")
      .trim()
      .toLowerCase() === selectedEmployee
  );

const reportDate =
  String(report.report_date || "").substring(0, 10);

const matchesDateFrom =
  dateFrom === "" ||
  reportDate >= dateFrom;

const matchesDateTo =
  dateTo === "" ||
  reportDate <= dateTo;

return (
  matchesSearch &&
  matchesEmployee &&
  matchesDateFrom &&
  matchesDateTo
);
});

  document.getElementById("totalReports").textContent =
    allReports.length;

  document.getElementById("readyReports").textContent =
  allReports.filter(r => {
    const status = String(r.completion_status || "").toLowerCase().trim();
    return status === "ready_to_invoice" || status === "ready to invoice";
  }).length;

document.getElementById("incompleteReports").textContent =
  allReports.filter(r => {
    const status = String(r.completion_status || "").toLowerCase().trim();
    return status === "not_complete" || status === "not complete";
  }).length;
  let totalRegularHours = 0;
let totalOvertimeHours = 0;

filtered.forEach(report => {

  (report.crew || []).forEach(person => {

    const personName =
      String(person.employee_name || "")
        .trim()
        .toLowerCase();

    if(
      selectedEmployee === "" ||
      personName === selectedEmployee
    ){
      totalRegularHours +=
        Number(person.regular_hours || 0);

      totalOvertimeHours +=
        Number(person.overtime_hours || 0);
    }

  });

});

document.getElementById("regularHours").textContent =
  totalRegularHours;

document.getElementById("overtimeHours").textContent =
  totalOvertimeHours;
  if(!filtered.length){

    box.innerHTML =
      '<div class="empty">No field reports found.</div>';

    return;
  }

  box.innerHTML = filtered.map(report => {

    const status =
  String(report.completion_status || "")
    .toLowerCase()
    .trim();

const isReady =
  status === "ready_to_invoice" ||
  status === "ready to invoice";

const statusText =
  isReady
    ? "READY TO INVOICE"
    : "NOT COMPLETE";

const statusClass =
  isReady
    ? "ready"
    : "incomplete";

   return `
      <div class="report" onclick="openReport('${report.id}')" style="cursor:pointer">
        <div class="report-top">

          <div class="report-date">
            ${escapeHtml(formatDate(report.report_date))}
          </div>

          <div class="status ${statusClass}">
            ${statusText}
          </div>

        </div>

        <div class="detail">

  <div>
    <strong>Project:</strong>
    ${escapeHtml(report.project_name || "—")}
  </div>
<div>
  <strong>Work Order:</strong>
  ${escapeHtml(report.work_order_number || "—")}
</div>
  <div>
    <strong>Job For:</strong>
    ${escapeHtml(report.job_for_assigned_by || "—")}
  </div>
          <div>
            <strong>Location:</strong>
            ${escapeHtml(report.locations || "—")}
          </div>

          <div>
            <strong>Work Accomplished:</strong>
            ${escapeHtml(report.work_accomplished || "—")}
          </div>

          <div>
            <strong>Materials:</strong>
            ${escapeHtml(report.materials_used || "—")}
          </div>

          <div>
            <strong>Notes:</strong>
            ${escapeHtml(report.completion_notes || "—")}
          </div>

          <div>
            <strong>Tomorrow:</strong>
            ${escapeHtml(report.tomorrow_plan || "—")}
          </div>

        </div>

      </div>
    `;

  }).join("");
}
async function openReport(reportId){

  const report =
    allReports.find(r => String(r.id) === String(reportId));

  if(!report){
    alert("Report could not be found.");
    return;
  }

  let crewHtml = "No crew recorded.";

  if(report.crew && report.crew.length > 0){

    crewHtml = report.crew.map(person => {

      return (
        "<div>" +
        escapeHtml(person.employee_name || "Unnamed Employee") +
        " — Regular: " +
        (person.regular_hours ?? 0) +
        " hrs, OT: " +
        (person.overtime_hours ?? 0) +
        " hrs</div>"
      );

    }).join("");
  }

  let photosHtml = "<div>No photos attached.</div>";

  if(report.photos && report.photos.length > 0){

    const photoBlocks = [];

    for(const photo of report.photos){

      const {data, error} = await db.storage
        .from("field-report-photos")
        .createSignedUrl(photo.storage_path, 3600);

      if(!error && data && data.signedUrl){

        photoBlocks.push(
          '<div style="margin-top:12px;">' +
          '<img src="' + data.signedUrl + '" ' +
          'style="width:100%;max-width:650px;border-radius:10px;border:1px solid #ddd;">' +
          '</div>'
        );
      }
    }

    if(photoBlocks.length > 0){
      photosHtml = photoBlocks.join("");
    }
  }

  const oldViewer = document.getElementById("reportViewer");

  if(oldViewer){
    oldViewer.remove();
  }

  const viewer = document.createElement("div");

  viewer.id = "reportViewer";

  viewer.style.cssText =
    "position:fixed;" +
    "inset:0;" +
    "background:rgba(0,0,0,.65);" +
    "z-index:9999;" +
    "overflow:auto;" +
    "padding:25px;";

  viewer.innerHTML =
    '<div style="' +
      'background:#fff;' +
      'max-width:760px;' +
      'margin:20px auto;' +
      'padding:24px;' +
      'border-radius:14px;' +
      'box-shadow:0 10px 40px rgba(0,0,0,.3);' +
    '">' +

      '<div style="float:right;display:flex;gap:8px;">' +

 '<button type="button" id="printReportViewer" style="' +
    'border:0;' +
    'background:#111;' +
    'color:#fff;' +
    'padding:8px 14px;' +
    'border-radius:8px;' +
    'cursor:pointer;' +
    'font-weight:700;' +
  '">PRINT / SAVE PDF</button>' +

  '<button type="button" id="closeReportViewer" style="' +
    'border:0;' +
    'background:#e8e8e8;' +
    'padding:8px 14px;' +
    'border-radius:8px;' +
    'cursor:pointer;' +
    'font-weight:700;' +
  '">CLOSE</button>' +

'</div>' +

      '<h2 style="margin-top:0;">FDR-001 REPORT</h2>' +

      '<p><strong>Date:</strong> ' +
        escapeHtml(formatDate(report.report_date)) +
      '</p>' +

      '<p><strong>Job For:</strong> ' +
        escapeHtml(report.job_for_assigned_by || "—") +
      '</p>' +
      '<p><strong>Project:</strong> ' +
        escapeHtml(report.project_name || "—") +
      '</p>' +
      '<p><strong>Work Order:</strong> ' +
        escapeHtml(report.work_order_number || "—") +
      '</p>' +

      '<hr>' +

      '<h3>Crew & Hours</h3>' +
      crewHtml +

      '<h3>Location</h3>' +
      '<div style="white-space:pre-wrap;">' +
        escapeHtml(report.locations || "—") +
      '</div>' +

      '<h3>Work Accomplished</h3>' +
      '<div style="white-space:pre-wrap;">' +
        escapeHtml(report.work_accomplished || "—") +
      '</div>' +

      '<h3>Materials</h3>' +
      '<div style="white-space:pre-wrap;">' +
        escapeHtml(report.materials_used || "—") +
      '</div>' +

     '<h3>Completion Status</h3>' +
'<div>' +
  escapeHtml(
    report.completion_status === "ready_to_invoice"
      ? "Ready to Invoice"
      : report.completion_status === "not_complete"
        ? "Not Complete"
        : (report.completion_status || "—")
  ) +
'</div>' +

      '<h3>Completion Notes</h3>' +
      '<div style="white-space:pre-wrap;">' +
        escapeHtml(report.completion_notes || "—") +
      '</div>' +

      '<h3>Tomorrow</h3>' +
      '<div style="white-space:pre-wrap;">' +
        escapeHtml(report.tomorrow_plan || "—") +
      '</div>' +

      '<hr>' +

      '<h3>Job Photos</h3>' +
      photosHtml +

    '</div>';

  document.body.appendChild(viewer);
document
  .getElementById("printReportViewer")
  .addEventListener("click", () => {

    const reportWindow = window.open("", "_blank");

    reportWindow.document.write(
      "<html><head><title>FDR-001 Report</title></head><body>" +
      viewer.querySelector("div").innerHTML +
      "</body></html>"
    );

    reportWindow.document.close();
    reportWindow.focus();
    reportWindow.print();
  });
  document
  .getElementById("closeReportViewer")
  .addEventListener("click", () => viewer.remove());
}

window.openReport = openReport;

async function loadReports(){

  document.getElementById("reports").innerHTML =
    '<div class="empty">Loading field reports...</div>';

  try{
    const {data,error} =
      await db
        .from("field_reports")
        .select("*")
        .order("report_date",{ascending:false})
        .order("created_at",{ascending:false});

    if(error) throw error;

    allReports = data || [];

const reportIds = allReports.map(report => report.id);

if(reportIds.length > 0){

  const {data: crewData, error: crewError} = await db
    .from("field_report_crew")
    .select("*")
    .in("field_report_id", reportIds);

  if(crewError){
    throw crewError;
  }

  allReports.forEach(report => {
    report.crew = crewData.filter(
      crew => String(crew.field_report_id) === String(report.id)
    );
  });
const employeeFilter = document.getElementById("employeeFilter");

if(employeeFilter){

  const employeeNames = [];

  allReports.forEach(report => {

    (report.crew || []).forEach(person => {

      const name = String(person.employee_name || "").trim();

      if(name && !employeeNames.includes(name)){
        employeeNames.push(name);
      }

    });

  });

  employeeNames.sort();

  employeeFilter.innerHTML =
    '<option value="">All Employees</option>' +
    employeeNames
      .map(name =>
        '<option value="' +
        escapeHtml(name) +
        '">' +
        escapeHtml(name) +
        '</option>'
      )
      .join("");
}
  const {data: photoData, error: photoError} = await db
  .from("field_report_photos")
  .select("*")
  .in("field_report_id", reportIds);

if(photoError){
  throw photoError;
}

allReports.forEach(report => {
  report.photos = photoData.filter(
    photo => String(photo.field_report_id) === String(report.id)
  );
});
}else{

  allReports = [];
}

renderReports();

    console.log(
      "Fireco OS reports loaded:",
      allReports
    );

  }catch(error){

    console.error(
      "Could not load field reports:",
      error
    );

    showError(
      error.message || "Could not load field reports."
    );

    document.getElementById("reports").innerHTML =
      '<div class="empty">Unable to load reports.</div>';
  }
}

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    document
      .getElementById("search")
      .addEventListener(
        "input",
        renderReports
      );
document
  .getElementById("employeeFilter")
  .addEventListener(
    "change",
    renderReports
  );
  document
  .getElementById("dateFrom")
  .addEventListener(
    "change",
    renderReports
  );

document
  .getElementById("dateTo")
  .addEventListener(
    "change",
    renderReports
  );
  document
  .getElementById("todayButton")
  .addEventListener(
    "click",
    () => {

      const today =
        new Date().toISOString().split("T")[0];

      document.getElementById("dateFrom").value = today;
      document.getElementById("dateTo").value = today;

      renderReports();
    }
  );
   document
  .getElementById("thisWeekButton")
  .addEventListener(
    "click",
    () => {

      const today = new Date();

      const day = today.getDay();
      const diffToMonday =
        day === 0 ? -6 : 1 - day;

      const monday = new Date(today);
      monday.setDate(today.getDate() + diffToMonday);

      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const formatDateInput = date =>
        date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");

      document.getElementById("dateFrom").value =
        formatDateInput(monday);

      document.getElementById("dateTo").value =
        formatDateInput(sunday);

      renderReports();
    }
  );
   document
  .getElementById("lastWeekButton")
  .addEventListener(
    "click",
    () => {

      const today = new Date();

      const day = today.getDay();
      const diffToMonday =
        day === 0 ? -6 : 1 - day;

      const thisMonday = new Date(today);
      thisMonday.setDate(today.getDate() + diffToMonday);

      const lastMonday = new Date(thisMonday);
      lastMonday.setDate(thisMonday.getDate() - 7);

      const lastSunday = new Date(lastMonday);
      lastSunday.setDate(lastMonday.getDate() + 6);

      const formatDateInput = date =>
        date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");

      document.getElementById("dateFrom").value =
        formatDateInput(lastMonday);

      document.getElementById("dateTo").value =
        formatDateInput(lastSunday);

      renderReports();
    }
  );
    document
  .getElementById("thisMonthButton")
  .addEventListener(
    "click",
    () => {

      const today = new Date();

      const firstDay =
        new Date(
          today.getFullYear(),
          today.getMonth(),
          1
        );

      const lastDay =
        new Date(
          today.getFullYear(),
          today.getMonth() + 1,
          0
        );

      const formatDateInput = date =>
        date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");

      document.getElementById("dateFrom").value =
        formatDateInput(firstDay);

      document.getElementById("dateTo").value =
        formatDateInput(lastDay);

      renderReports();
    }
  );
    document
  .getElementById("readyFilter")
  .addEventListener(
    "click",
    () => {
      const searchBox = document.getElementById("search");
      searchBox.value = "ready_to_invoice";
      renderReports();
    }
  );
    document
  .getElementById("allReportsFilter")
  .addEventListener(
    "click",
    () => {
      const searchBox = document.getElementById("search");
      searchBox.value = "";
      renderReports();
    }
  );
    document
  .getElementById("incompleteFilter")
  .addEventListener(
    "click",
    () => {
      const searchBox = document.getElementById("search");
    searchBox.value = "not_complete";
      renderReports();
    }
  );
    document
      .getElementById("refreshButton")
      .addEventListener(
        "click",
        loadReports
      );

    await loadReports();
  }
);

</script>

</body>
</html>
